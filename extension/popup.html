<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JobOps</title>
</head>

<body>
    <h1>JobOps</h1>

    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button id="login">
        Login
    </button>

    <hr>

    <button id="detect-job">
        Detect Job
    </button>

    <button id="save-job">
        Save Job
    </button>

    <p id="status">
        Not logged in
    </p>

    <script src="popup.js"></script>
</body>
</html>
